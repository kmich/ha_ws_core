blueprint:
  name: "WS Core: Frost & Freeze Alert"
  description: >
    Sends a notification when temperature drops below a configurable threshold.
    Includes frost point and dew point context. Uses the ws_core Temperature sensor.
    Optionally also fires an early warning from the Pattern Forecast frost
    probability (sensor.ws_pattern_frost_12h), but only while that sensor's
    maturity attribute is skilled. Leave that input empty for the original behaviour.
  domain: automation
  source_url: https://github.com/kmich/ha_ws_core/blob/main/blueprints/automation/ws_core/frost_alert.yaml
  input:
    temperature_sensor:
      name: WS Temperature Sensor
      description: The ws_core temperature sensor (sensor.ws_temperature or similar)
      selector:
        entity:
          domain: sensor
          device_class: temperature
    freeze_threshold:
      name: Freeze Threshold
      description: Temperature below which the alert fires (°C)
      default: 2.0
      selector:
        number:
          min: -20
          max: 10
          step: 0.5
          unit_of_measurement: "°C"
    pattern_frost_sensor:
      name: Pattern Forecast frost sensor (optional early warning)
      description: >
        Optional. Pick sensor.ws_pattern_frost_12h to also be warned before the
        temperature drops. It only counts while the sensor's maturity attribute
        is skilled. Leave empty to alert on the temperature alone.
      default: ""
      selector:
        entity:
          domain: sensor
    pattern_frost_threshold:
      name: Pattern frost probability threshold
      description: Chance of frost (%) at or above which the early warning fires
      default: 50
      selector:
        number:
          min: 10
          max: 95
          step: 5
          unit_of_measurement: "%"
    notify_target:
      name: Notify target
      description: Notification target (e.g. notify.mobile_app_phone)
      selector:
        text:
    cooldown_hours:
      name: Alert cooldown
      description: Minimum hours between repeat alerts
      default: 6
      selector:
        number:
          min: 1
          max: 24
          step: 1
          unit_of_measurement: "h"

variables:
  threshold: !input freeze_threshold
  cooldown_hours: !input cooldown_hours
  pattern_sensor: !input pattern_frost_sensor
  pattern_threshold: !input pattern_frost_threshold

trigger_variables:
  pattern_sensor: !input pattern_frost_sensor
  pattern_threshold: !input pattern_frost_threshold

trigger:
  - platform: numeric_state
    entity_id: !input temperature_sensor
    below: !input freeze_threshold
    for:
      minutes: 5
  # Optional early warning: only ever true when a Pattern Forecast sensor is chosen
  # AND its maturity is skilled. With the input left empty this never fires.
  - platform: template
    value_template: >
      {% if pattern_sensor in ['', none] %}false
      {% else %}
        {{ states(pattern_sensor) | is_number
           and states(pattern_sensor) | float(0) >= pattern_threshold | float(50)
           and state_attr(pattern_sensor, 'maturity') == 'skilled' }}
      {% endif %}

condition:
  - condition: template
    value_template: >
      {% set last = state_attr(this.entity_id, 'last_triggered') %}
      {% if last == none %}true
      {% else %}
        {{ (now() - last).total_seconds() / 3600 > (cooldown_hours | int) }}
      {% endif %}

action:
  - action: !input notify_target
    data:
      title: "Frost Alert"
      message: >
        {% if trigger.platform == 'template' %}
        Early warning: Pattern Forecast gives a {{ states(pattern_sensor) | round(0) }}% chance of frost
        within the next 12 hours. Check outdoor plants and pipes.
        {% else %}
        Temperature has dropped to {{ states(trigger.entity_id) | round(1) }}°C
        (below your {{ threshold }}°C threshold).
        {% set frost = states('sensor.' + trigger.entity_id.split('.')[1].replace('temperature', 'frost_point')) %}
        {% if frost != 'unavailable' and frost != 'unknown' %}
        Frost point: {{ frost | round(1) }}°C.
        {% endif %}
        Check outdoor plants and pipes.
        {% endif %}
      data:
        tag: ws_core_frost_alert
        priority: high

mode: single
max_exceeded: silent

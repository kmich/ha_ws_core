blueprint:
  name: "WS Core: Weather Window Notification"
  description: >
    Notifies you ahead of an upcoming suitable weather window (for outdoor laundry
    drying, garden work, or custom activity). Triggers accurately using Home Assistant's
    native time trigger at the timestamp entity.
  domain: automation
  input:
    next_start_sensor:
      name: Weather Window Next Start Sensor
      description: The timestamp sensor for the window (e.g. sensor.ws_window_outdoor_drying_next_start)
      selector:
        entity:
          domain: sensor
          device_class: timestamp
    notify_device:
      name: Device to notify
      description: Device that receives the alert notification
      selector:
        device:
          integration: mobile_app
    lead_time_minutes:
      name: Lead Time Notification (Minutes Before Start)
      description: How many minutes before the window start time to send the alert (negative offset)
      default: 15
      selector:
        number:
          min: 0
          max: 120
          step: 5
          unit_of_measurement: "min"
    custom_message:
      name: Custom Message (Optional)
      description: Optional extra text to include in the notification
      default: ""
      selector:
        text:

mode: restart
max_exceeded: silent

trigger:
  - platform: time
    at: !input next_start_sensor
    offset: >-
      {% set mins = (-1 * (lead_time_minutes | int(15))) %}
      {{ "%+03d:%02d:00" | format((mins // 60), ((-mins) % 60)) if mins < 0 else "00:00:00" }}

condition:
  - condition: template
    value_template: >-
      {{ states(next_start_sensor) not in ['unknown', 'unavailable', 'none', ''] }}

action:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: "Weather Window Starting Soon"
    message: >-
      A suitable weather window for {{ state_attr(next_start_sensor, 'friendly_name') | default('your activity') }}
      is scheduled to begin at {{ as_timestamp(states(next_start_sensor)) | timestamp_custom('%H:%M', true) }}.
      {% if custom_message %}{{ custom_message }}{% endif %}

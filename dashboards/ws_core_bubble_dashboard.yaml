##############################################################################
# Weather Station Core - Bubble Card Dashboard  (v2.11)
#
# A mobile-first dashboard built on Bubble Card. One page of summary buttons;
# tap any of them, or use the bottom bar, to open a pop-up with the details:
# Temperature, Rain, Wind, Forecast (including Pattern Forecast), Garden & Air
# and Station.
#
# Installation:
#   1. Settings -> Dashboards -> Add Dashboard -> "New dashboard from scratch"
#   2. Three-dot menu -> "Edit Dashboard" -> three-dot menu -> "Raw configuration
#      editor" -> paste this file.
#   3. Replace the prefix "ws" with your entity prefix if different.
#
# Required HACS cards: Bubble Card v3.2.0 or later (pop-ups use the standalone
# format introduced in v3.2.0). Everything else is a built-in card.
#
# Cards for opt-in features (nowcast, comfort indices, Pattern Forecast, air
# quality, pollen, solar forecast, fire risk, fog, thunderstorm risk) only
# appear when that feature's switch is on.
##############################################################################

title: Weather (Bubble)
views:
  - title: Weather
    path: weather
    icon: mdi:weather-partly-cloudy
    cards:
      # -----------------------------------------------------------------------
      # Main page: summary buttons. Each one opens its pop-up.
      # -----------------------------------------------------------------------
      - type: custom:bubble-card
        card_type: separator
        name: Now
        icon: mdi:weather-partly-cloudy

      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.ws_temperature
        name: Temperature
        icon: mdi:thermometer
        show_state: true
        sub_button:
          - entity: sensor.ws_feels_like
            name: Feels like
            icon: mdi:thermometer-lines
            show_state: true
          - entity: sensor.ws_humidity
            name: Humidity
            icon: mdi:water-percent
            show_state: true
        button_action:
          tap_action:
            action: navigate
            navigation_path: "#ws-temperature"

      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.ws_rain_today_mm
        name: Rain today
        icon: mdi:weather-pouring
        show_state: true
        sub_button:
          - entity: sensor.ws_rain_rate
            name: Rate
            icon: mdi:weather-rainy
            show_state: true
          - entity: sensor.ws_rain_last_24h
            name: Last 24 h
            icon: mdi:history
            show_state: true
        button_action:
          tap_action:
            action: navigate
            navigation_path: "#ws-rain"

      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.ws_wind_speed
        name: Wind
        icon: mdi:weather-windy
        show_state: true
        sub_button:
          - entity: sensor.ws_wind_gust
            name: Gust
            icon: mdi:weather-windy-variant
            show_state: true
          - entity: sensor.ws_wind_direction
            name: Direction
            icon: mdi:compass-outline
            show_state: true
        button_action:
          tap_action:
            action: navigate
            navigation_path: "#ws-wind"

      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.ws_zambretti_forecast
        name: Outlook
        icon: mdi:crystal-ball
        show_state: true
        sub_button:
          - entity: sensor.ws_pressure_trend
            name: Pressure trend
            icon: mdi:trending-up
            show_state: true
          - entity: sensor.ws_sea_level_pressure
            name: Pressure
            icon: mdi:gauge
            show_state: true
        button_action:
          tap_action:
            action: navigate
            navigation_path: "#ws-forecast"

      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.ws_et0_daily
        name: Garden
        icon: mdi:sprout
        show_state: true
        sub_button:
          - entity: sensor.ws_uv_index
            name: UV
            icon: mdi:sun-wireless
            show_state: true
          - entity: sensor.ws_irrigation_deficit
            name: Water deficit
            icon: mdi:water-minus
            show_state: true
        button_action:
          tap_action:
            action: navigate
            navigation_path: "#ws-garden"

      - type: weather-forecast
        entity: weather.ws
        forecast_type: daily
        show_current: false
        show_forecast: true

      # -----------------------------------------------------------------------
      # Pop-up: Temperature and comfort
      # -----------------------------------------------------------------------
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ws-temperature"
        name: Temperature
        icon: mdi:thermometer
        entity: sensor.ws_temperature
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Last 24 hours
            icon: mdi:clock-outline
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_temperature_high_24h
            name: High
            icon: mdi:thermometer-chevron-up
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_temperature_low_24h
            name: Low
            icon: mdi:thermometer-chevron-down
            show_state: true
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.ws_temperature
                name: Temperature
              - entity: sensor.ws_dew_point
                name: Dew point
          - type: custom:bubble-card
            card_type: separator
            name: How it feels
            icon: mdi:account-outline
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_feels_like
            name: Feels like
            icon: mdi:thermometer-lines
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_dew_point
            name: Dew point
            icon: mdi:water-thermometer
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_frost_point
            name: Frost point
            icon: mdi:snowflake-thermometer
            show_state: true
          - type: conditional
            conditions:
              - condition: state
                entity: switch.ws_enable_comfort_indices
                state: "on"
            card:
              type: vertical-stack
              cards:
                - type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.ws_utci
                  name: UTCI (heat stress)
                  icon: mdi:human-handsup
                  show_state: true
                - type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.ws_wbgt
                  name: WBGT (outdoor work and sport)
                  icon: mdi:run
                  show_state: true

      # -----------------------------------------------------------------------
      # Pop-up: Rain
      # -----------------------------------------------------------------------
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ws-rain"
        name: Rain
        icon: mdi:weather-pouring
        entity: sensor.ws_rain_today_mm
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Totals
            icon: mdi:cup-water
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_rain_last_1h
            name: Last hour
            icon: mdi:clock-outline
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_rain_this_month
            name: This month
            icon: mdi:calendar-month
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_rain_this_year
            name: This year
            icon: mdi:calendar
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_dry_streak_days
            name: Days since rain
            icon: mdi:weather-sunny-off
            show_state: true
          - type: conditional
            conditions:
              - condition: state
                entity: switch.ws_enable_nowcast
                state: "on"
            card:
              type: vertical-stack
              cards:
                - type: custom:bubble-card
                  card_type: separator
                  name: Nowcast (Open-Meteo)
                  icon: mdi:radar
                - type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.ws_minutes_until_rain
                  name: Minutes until rain
                  icon: mdi:timer-sand
                  show_state: true
                - type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.ws_rain_next_60min
                  name: Next 60 minutes
                  icon: mdi:weather-rainy
                  show_state: true
          - type: conditional
            conditions:
              - condition: state
                entity: switch.ws_enable_pattern_forecast
                state: "on"
            card:
              type: vertical-stack
              cards:
                - type: custom:bubble-card
                  card_type: separator
                  name: Pattern Forecast (local)
                  icon: mdi:chart-bell-curve-cumulative
                - type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.ws_pattern_rain_1h
                  name: Chance of rain, 1 h
                  icon: mdi:umbrella-outline
                  show_state: true
                  show_attribute: true
                  attribute: maturity
                - type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.ws_pattern_rain_3h
                  name: Chance of rain, 3 h
                  icon: mdi:umbrella
                  show_state: true
                  show_attribute: true
                  attribute: maturity
                - type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.ws_pattern_rain_6h
                  name: Chance of rain, 6 h
                  icon: mdi:umbrella-closed
                  show_state: true
                  show_attribute: true
                  attribute: maturity

      # -----------------------------------------------------------------------
      # Pop-up: Wind
      # -----------------------------------------------------------------------
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ws-wind"
        name: Wind
        icon: mdi:weather-windy
        entity: sensor.ws_wind_speed
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_wind_gust
            name: Gust
            icon: mdi:weather-windy-variant
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_wind_gust_max_24h
            name: Strongest gust, 24 h
            icon: mdi:weather-tornado
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_wind_beaufort
            name: Beaufort
            icon: mdi:sail-boat
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_wind_direction
            name: Direction
            icon: mdi:compass-outline
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_dominant_wind_direction
            name: Dominant direction
            icon: mdi:compass-rose
            show_state: true
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.ws_wind_speed
                name: Wind
              - entity: sensor.ws_wind_gust
                name: Gust

      # -----------------------------------------------------------------------
      # Pop-up: Forecast (Zambretti, provider forecast, Pattern Forecast)
      # -----------------------------------------------------------------------
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ws-forecast"
        name: Forecast
        icon: mdi:crystal-ball
        entity: sensor.ws_zambretti_forecast
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Barometer
            icon: mdi:gauge
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_pressure_trend
            name: Pressure trend
            icon: mdi:trending-up
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_sea_level_pressure
            name: Sea-level pressure
            icon: mdi:gauge
            show_state: true
          - type: conditional
            conditions:
              - condition: state
                entity: switch.ws_enable_pattern_forecast
                state: "on"
            card:
              type: vertical-stack
              cards:
                - type: custom:bubble-card
                  card_type: separator
                  name: Pattern Forecast (local)
                  icon: mdi:chart-bell-curve-cumulative
                - type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.ws_pattern_forecast_status
                  name: Status
                  icon: mdi:school-outline
                  show_state: true
                - type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.ws_pattern_frost_12h
                  name: Chance of frost, 12 h
                  icon: mdi:snowflake
                  show_state: true
                  show_attribute: true
                  attribute: maturity
                - type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.ws_pattern_heat_24h
                  name: Chance of a hot day, 24 h
                  icon: mdi:sun-thermometer
                  show_state: true
                  show_attribute: true
                  attribute: maturity
                - type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.ws_pattern_gust_3h
                  name: Chance of a strong gust, 3 h
                  icon: mdi:weather-windy
                  show_state: true
                  show_attribute: true
                  attribute: maturity
                - type: markdown
                  title: Maturity and why
                  content: |
                    {% set t = [('sensor.ws_pattern_rain_1h', 'Rain, 1 h'), ('sensor.ws_pattern_rain_3h', 'Rain, 3 h'), ('sensor.ws_pattern_rain_6h', 'Rain, 6 h'), ('sensor.ws_pattern_frost_12h', 'Frost, 12 h'), ('sensor.ws_pattern_heat_24h', 'Hot day, 24 h'), ('sensor.ws_pattern_gust_3h', 'Strong gust, 3 h'), ('sensor.ws_pattern_storm_3h', 'Thunderstorm, 3 h')] %}
                    | Forecast | Chance | Maturity | Why |
                    |---|---|---|---|
                    {% for e, label in t if state_attr(e, 'maturity') %}| {{ label }} | {{ (states(e) ~ ' %') if states(e) not in ['unknown', 'unavailable'] else '-' }} | {{ state_attr(e, 'maturity') }} | {% for f in state_attr(e, 'top_factors') or [] %}{{ f.factor | replace('_', ' ') }} ({{ f.effect }}){{ ', ' if not loop.last }}{% endfor %} |
                    {% endfor %}

                    Use a forecast in automations once its maturity is **skilled**.
          - type: conditional
            conditions:
              - condition: state
                entity: switch.ws_enable_thunderstorm_risk
                state: "on"
            card:
              type: custom:bubble-card
              card_type: button
              button_type: state
              entity: sensor.ws_thunderstorm_risk
              name: Thunderstorm risk
              icon: mdi:weather-lightning
              show_state: true
          - type: conditional
            conditions:
              - condition: state
                entity: switch.ws_enable_fog
                state: "on"
            card:
              type: custom:bubble-card
              card_type: button
              button_type: state
              entity: sensor.ws_fog_probability
              name: Fog probability
              icon: mdi:weather-fog
              show_state: true
          - type: weather-forecast
            entity: weather.ws
            forecast_type: hourly
            show_current: false
            show_forecast: true

      # -----------------------------------------------------------------------
      # Pop-up: Garden and air
      # -----------------------------------------------------------------------
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ws-garden"
        name: Garden & Air
        icon: mdi:sprout
        entity: sensor.ws_et0_daily
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Irrigation
            icon: mdi:sprinkler-variant
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_et0_daily
            name: Evapotranspiration (ET0) today
            icon: mdi:water-sync
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_irrigation_deficit
            name: Water deficit
            icon: mdi:water-minus
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_vpd
            name: Vapour pressure deficit
            icon: mdi:leaf
            show_state: true
          - type: custom:bubble-card
            card_type: separator
            name: Sun
            icon: mdi:white-balance-sunny
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_uv_index
            name: UV index
            icon: mdi:sun-wireless
            show_state: true
          - type: conditional
            conditions:
              - condition: state
                entity: switch.ws_enable_solar_forecast
                state: "on"
            card:
              type: custom:bubble-card
              card_type: button
              button_type: state
              entity: sensor.ws_solar_forecast_today
              name: Solar forecast today
              icon: mdi:solar-power
              show_state: true
          - type: conditional
            conditions:
              - condition: state
                entity: switch.ws_enable_air_quality
                state: "on"
            card:
              type: vertical-stack
              cards:
                - type: custom:bubble-card
                  card_type: separator
                  name: Air quality
                  icon: mdi:air-filter
                - type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.ws_air_quality_index
                  name: Air quality index
                  icon: mdi:air-filter
                  show_state: true
                - type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.ws_pm2_5
                  name: PM2.5
                  icon: mdi:molecule
                  show_state: true
          - type: conditional
            conditions:
              - condition: state
                entity: switch.ws_enable_pollen
                state: "on"
            card:
              type: custom:bubble-card
              card_type: button
              button_type: state
              entity: sensor.ws_pollen_level
              name: Pollen
              icon: mdi:flower-pollen
              show_state: true
          - type: conditional
            conditions:
              - condition: state
                entity: switch.ws_enable_fire_risk_score
                state: "on"
            card:
              type: custom:bubble-card
              card_type: button
              button_type: state
              entity: sensor.ws_fire_risk_score
              name: Fire risk
              icon: mdi:fire-alert
              show_state: true

      # -----------------------------------------------------------------------
      # Pop-up: Station health
      # -----------------------------------------------------------------------
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ws-station"
        name: Station
        icon: mdi:access-point
        entity: sensor.ws_station_health
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_data_quality_score
            name: Data quality
            icon: mdi:check-decagram-outline
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_package_status
            name: Sensor package
            icon: mdi:package-variant-closed
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_battery
            name: Battery
            icon: mdi:battery
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_sensor_stuck
            name: Stuck sensors
            icon: mdi:alert-octagon-outline
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ws_alert_state
            name: Alerts
            icon: mdi:alert-outline
            show_state: true

      # -----------------------------------------------------------------------
      # Bottom bar. Bubble Card requires it to be the last card in the view.
      # -----------------------------------------------------------------------
      - type: custom:bubble-card
        card_type: horizontal-buttons-stack
        1_name: Temp
        1_icon: mdi:thermometer
        1_link: "#ws-temperature"
        2_name: Rain
        2_icon: mdi:weather-pouring
        2_link: "#ws-rain"
        3_name: Wind
        3_icon: mdi:weather-windy
        3_link: "#ws-wind"
        4_name: Forecast
        4_icon: mdi:crystal-ball
        4_link: "#ws-forecast"
        5_name: Garden
        5_icon: mdi:sprout
        5_link: "#ws-garden"
        6_name: Station
        6_icon: mdi:access-point
        6_link: "#ws-station"

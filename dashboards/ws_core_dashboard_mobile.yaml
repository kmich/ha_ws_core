##############################################################################
# Weather Station Core – Mobile Dashboard  (v2.0)
#
# A single-column, touch-optimised layout for phones. Large tiles, minimal
# horizontal scrolling, and the most-glanced values first.
#
# Installation:
#   1. Settings → Dashboards → Add Dashboard → "New dashboard from scratch"
#   2. Three-dot menu → "Edit Dashboard" → three-dot menu → "Raw configuration
#      editor" → paste this file.
#   3. Replace the prefix "ws" with your entity prefix if different.
#
# Required HACS cards: mushroom, mini-graph-card
##############################################################################

title: Weather (Mobile)
views:
  - title: Home
    icon: mdi:cellphone
    path: home
    type: sections
    max_columns: 1
    sections:

      # ── Headline ────────────────────────────────────────────────
      - type: grid
        cards:
          - type: weather-forecast
            entity: weather.ws
            show_current: true
            show_forecast: false

          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.ws_temperature') }}°C — feels {{ states('sensor.ws_feels_like') }}°C"
            secondary: "{{ states('sensor.ws_current_condition') }}"
            icon: mdi:thermometer
            icon_color: >
              {% set t = states('sensor.ws_temperature') | float(0) %}
              {% if t <= 0 %}blue{% elif t <= 10 %}cyan{% elif t <= 20 %}green
              {% elif t <= 30 %}orange{% else %}red{% endif %}
            multiline_secondary: true

      # ── Core conditions (2-up chips fit phone width) ─────────────
      - type: grid
        columns: 2
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.ws_humidity
            name: Humidity
            icon: mdi:water-percent
          - type: custom:mushroom-entity-card
            entity: sensor.ws_sea_level_pressure
            name: Pressure
            icon: mdi:gauge
          - type: custom:mushroom-entity-card
            entity: sensor.ws_wind_speed
            name: Wind
            icon: mdi:weather-windy
          - type: custom:mushroom-entity-card
            entity: sensor.ws_wind_gust
            name: Gust
            icon: mdi:weather-windy-variant
          - type: custom:mushroom-entity-card
            entity: sensor.ws_rain_today_mm
            name: Rain Today
            icon: mdi:weather-rainy
          - type: custom:mushroom-entity-card
            entity: sensor.ws_uv_index
            name: UV
            icon: mdi:sun-wireless

      # ── Will it rain? ────────────────────────────────────────────
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: "Rain probability: {{ states('sensor.ws_rain_probability_combined') }}%"
            secondary: "{{ states('sensor.ws_zambretti_forecast') }}"
            icon: mdi:weather-rainy
            icon_color: blue
            multiline_secondary: true

      # ── Snow (requires Feature: Snow, off by default) ─────────────
      - type: grid
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: switch.ws_enable_snow
                state: "on"
            card:
              type: entities
              title: Snow
              icon: mdi:snowflake
              entities:
                - entity: sensor.ws_snow_phase
                  name: Phase
                - entity: binary_sensor.ws_snow_falling
                  name: Falling
                - entity: sensor.ws_snow_rate
                  name: Rate
                - entity: sensor.ws_snow_today
                  name: Today

      # ── Vs. Historical Normal (requires Feature: Historical Climate Normals) ──
      - type: grid
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: switch.ws_enable_climate_normals
                state: "on"
            card:
              type: entities
              title: "Vs. Historical Normal"
              icon: mdi:calendar-clock
              entities:
                - entity: sensor.ws_temp_anomaly_normal
                  name: Temperature Anomaly
                - entity: sensor.ws_rain_anomaly_normal
                  name: Rain Anomaly

      # ── 24h temperature trend ────────────────────────────────────
      - type: grid
        cards:
          - type: custom:mini-graph-card
            name: Temperature (24h)
            entities:
              - entity: sensor.ws_temperature
                name: Temp
              - entity: sensor.ws_feels_like
                name: Feels
                show_line: true
                show_points: false
            hours_to_show: 24
            points_per_hour: 2
            line_width: 2
            show:
              labels: true
              extrema: true

      # ── 24h pressure trend ───────────────────────────────────────
      - type: grid
        cards:
          - type: custom:mini-graph-card
            name: Pressure (24h)
            entities:
              - entity: sensor.ws_sea_level_pressure
            hours_to_show: 24
            points_per_hour: 2
            line_width: 2
            show:
              labels: true
              extrema: true

      # ── Forecast ─────────────────────────────────────────────────
      - type: grid
        cards:
          - type: weather-forecast
            entity: weather.ws
            forecast_type: daily

      # ── Station health ───────────────────────────────────────────
      - type: grid
        columns: 2
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.ws_station_health
            name: Health
            icon: mdi:heart-pulse
          - type: custom:mushroom-entity-card
            entity: sensor.ws_data_quality_score
            name: Quality

      # ── Storm log (requires HA 2023.8+) ────────────────────────────
      - type: grid
        cards:
          - type: logbook
            title: Recent Weather Events
            entities:
              - event.ws_rain_event
              - event.ws_frost_event
              - event.ws_lightning_event
            hours_to_show: 72
            icon: mdi:star-check-outline

      # ── Adaptive Calibration (requires Feature: Adaptive Sensor Calibration) ──
      - type: grid
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: switch.ws_enable_auto_calibration
                state: "on"
            card:
              type: entities
              title: Adaptive Calibration
              icon: mdi:tune
              entities:
                - entity: sensor.ws_auto_calibration
                  name: Status

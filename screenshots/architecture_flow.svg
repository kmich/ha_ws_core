<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 384" width="920" height="384" role="img" aria-labelledby="t d">
  <title id="t">How ws_core fits into Home Assistant</title>
  <desc id="d">Your station's readings go into ws_core, which runs inside Home Assistant and produces sensors, a weather entity, blueprints and dashboards. A forecast provider is the only internet source used by default.</desc>
  <style>
    /* Colours follow GitHub's light and dark themes so the diagram sits on either. */
    .box { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1; }
    .core { fill: #f6f8fa; stroke: #0969da; stroke-width: 1.5; }
    .net { fill: none; stroke: #8c959f; stroke-width: 1; stroke-dasharray: 5 4; }
    .rule { stroke: #d1d9e0; stroke-width: 1; }
    .flow { stroke: #0969da; stroke-width: 1.5; fill: none; }
    .flow-net { stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .head { fill: #0969da; }
    .head-net { fill: #8c959f; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; font-size: 13px; }
    .h { font-size: 14px; font-weight: 600; }
    .lbl { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; fill: #59636e; }
    .mut { fill: #59636e; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .box, .core { fill: #151b23; }
      .box, .rule { stroke: #3d444d; }
      .core, .flow { stroke: #4493f8; }
      .head { fill: #4493f8; }
      .net, .flow-net { stroke: #656c76; }
      .head-net { fill: #656c76; }
      text { fill: #f0f6fc; }
      .lbl, .mut { fill: #9198a1; }
    }
  </style>

  <!-- Your station -->
  <rect class="box" x="20" y="20" width="250" height="262" rx="8"/>
  <text class="h" x="36" y="46">Your station</text>
  <line class="rule" x1="36" y1="60" x2="254" y2="60"/>
  <text x="36" y="86">Shelly WS90, Ecowitt, Tempest,</text>
  <text x="36" y="106">Davis, Netatmo, ESPHome</text>
  <text class="lbl" x="36" y="136">READINGS</text>
  <text x="36" y="158">Temperature and humidity</text>
  <text x="36" y="180">Pressure</text>
  <text x="36" y="202">Wind speed, gust, direction</text>
  <text x="36" y="224">Rain total</text>
  <text class="mut" x="36" y="254">Optional: UV, solar, lightning</text>

  <!-- ws_core -->
  <rect class="core" x="335" y="20" width="250" height="262" rx="8"/>
  <text class="h" x="351" y="46">ws_core, in Home Assistant</text>
  <line class="rule" x1="351" y1="60" x2="569" y2="60"/>
  <text class="lbl" x="351" y="86">DERIVED</text>
  <text x="351" y="106">Dew and frost point, feels like</text>
  <text x="351" y="126">UTCI, WBGT, ET₀, fire indices</text>
  <text class="lbl" x="351" y="154">FORECASTS</text>
  <text x="351" y="174">Zambretti, from your barometer</text>
  <text x="351" y="194">Pattern Forecast, learned locally</text>
  <text x="351" y="214">Adaptive rain chance</text>
  <text class="lbl" x="351" y="242">DATA QUALITY</text>
  <text x="351" y="262">Stuck, spike and drift checks</text>

  <!-- What you get -->
  <rect class="box" x="650" y="20" width="250" height="262" rx="8"/>
  <text class="h" x="666" y="46">What you get</text>
  <line class="rule" x1="666" y1="60" x2="884" y2="60"/>
  <text x="666" y="86">Sensors and event entities</text>
  <text x="666" y="108">A weather entity with forecasts</text>
  <text x="666" y="130">10 automation blueprints</text>
  <text x="666" y="152">5 ready-made dashboards</text>
  <text x="666" y="174">Alerts and station health</text>
  <text class="lbl" x="666" y="206">OPTIONAL</text>
  <text x="666" y="228">MQTT discovery</text>
  <text x="666" y="250">Uploads to 8 weather networks</text>

  <!-- Flow between the boxes -->
  <line class="flow" x1="276" y1="151" x2="324" y2="151"/>
  <polygon class="head" points="323,145.5 333,151 323,156.5"/>
  <line class="flow" x1="591" y1="151" x2="639" y2="151"/>
  <polygon class="head" points="638,145.5 648,151 638,156.5"/>

  <!-- Internet sources -->
  <rect class="net" x="260" y="314" width="400" height="56" rx="8"/>
  <text x="460" y="337" text-anchor="middle">Open-Meteo or your chosen forecast provider</text>
  <text class="mut" x="460" y="357" text-anchor="middle">Forecast and sanity check on by default; the rest opt-in</text>
  <line class="flow-net" x1="460" y1="312" x2="460" y2="293"/>
  <polygon class="head-net" points="454.5,293 460,284 465.5,293"/>
</svg>
